<!DOCTYPE html lang="en">
    <head>
        <title>Oswell's Avatar</title>
        <style>
            canvas{
                border:1px solid black;
            }
            body{
                margin:0;
            }
            #side-panel{
                position:absolute;
                top:510;
                left:10;
                font-family: Arial;
            }
            #camCanvas{
                max-width:173px;
            }
            #sliders{
                display:none;
            }
            #calibrateBtn{
                display:none;
            }
            #speakBtn{
                display:none;
            }
            #inputContainer{
                position: relative;
            }
        </style>
    </head>
    <body>
        <canvas id="myCanvas"></canvas>
        <div id="side-panel">
            <div id="sliders">
                Face:<br>
                X <input type="range" min="-0.75" max="0.75" step="0.1" onChange="updateLookAt(this, 'x')"/>
                <br>
                Y <input type="range" min="-0.45" max="0.65" step="0.05" onChange="updateLookAt(this, 'y')"/>
                <br><br>
                Mouth:
                <br>
                X <input type="range" min="-0.70" max="0.70" step="0.1" onChange="updateMouth(this, 'x')"/>
                <br>
                Y <input type="range" min="0.00" max="0.80" step="0.05" onChange="updateMouth(this, 'y')"/>
                <br>
                <button id="speakBtn" onclick="setSpeak()">Speak</button>
                <br><br>
            </div>
            <div id="cameraOutput">
                <canvas id="camCanvas"></canvas>
                <br><br>
            </div>
            
            <div id="inputContainer">
                INPUT:
                <br>
                <select name="input" id="input" onchange="onInputChange(this)">
                    <option value="face detection">face detection</option>
                    <option value="markers">markers</option>
                    <option value="sliders">sliders</option>
                </select>
                <br><br>
            </div>
            <button id="calibrateBtn" onclick="calibrate()">Calibrate</button>
        </div>

        <script src="avatar.js"></script>
        <script src="head.js"></script>
        <script src="complexions.js"></script>
        <script src="eye.js"></script>
        <script src="ear.js"></script>
        <script src="nose.js"></script>
        <script src="mouth.js"></script>
        <script src="neck.js"></script>
        <script src="body.js"></script>
        <script src="controlPanel.js"></script>
        <script src="camera.js"></script>
        <script src="math.js"></script>
        <script src="doublePendulum.js"></script>
        <script src="pendulum.js"></script>
        <script src="physics.js"></script>
        <script src="reference.js"></script>
        <script>
            const DEBUG=true;
            const canvas=document.getElementById("myCanvas");
            canvas.width=800;
            canvas.height=500; 
            
            const ctx=canvas.getContext("2d");
            const camCtx=camCanvas.getContext("2d");

            // Transform canvas into coordinate system between [-1, 1].
            ctx.translate(canvas.width/2,canvas.height/2);
            ctx.scale(canvas.width*0.5,canvas.height*0.5);
            ctx.lineWidth=0.005;

            const img=new Image();
            img.src="oswel.avif";
            
            const skinTone="rgba(219,221,225,0.9)";
            // point A
            const lookAt={x:0,y:-0.040,initX:0,initY:-0.040,xRange:[0,0.090],yRange:[-0.040,0.1],xOffset:0,yOffset:0};
            const avatar=new Avatar(lookAt,skinTone);

            img.onload=function(){
                animate();
            }

            // TODO: Remove this at the end of the project.
            canvas.addEventListener("click",getCoords);
            function getCoords(evt) {
                const x=(evt.x-canvas.width/2)/(canvas.width/2);
                const y=(evt.y-canvas.height/2)/(canvas.height/2)

                const offset = {
                    x:x,
                    y:y,
                }
                
                // const offset={
                //     x:x-lookAt.x,
                //     y:y-lookAt.y
                // }
                console.log(offset.x.toFixed(2)+","+offset.y.toFixed(2));
            }
            // END TODO

            function animate(){

                // TODO: Remove this at the end of the project.
                ctx.clearRect(-1,-1,2,2);
                // ctx.globalAlpha=0.3;
                // ctx.drawImage(img,-1,-1,2,2);
                // ctx.globalAlpha=1;
                // END TODO
                
                if(video){
                    processImage();
                }
                avatar.draw(ctx);
                requestAnimationFrame(animate);
            }
            
            // Called when changing the sliders
            function updateLookAt(info,attr){   
                const p=lookAt;
                let yRange=p.yRange;
                let value=info.value;
                if(p.yNegRange){
                    yRange=info.value<0?p.yNegRange:p.yRange;
                    value=Math.abs(value);
                }
                switch(attr){
                    case "x":
                        p.xOffset=value;
                        p.x=lerp(p.xRange[0],p.xRange[1],info.value);
                        break;
                    case "y":
                        p.yOffset=value;
                        p.y=lerp(yRange[0],yRange[1],value);
                        break;
                } 
            }

            // Called when changing the sliders
            function updateMouth(info,attr){   
                switch(attr){
                    case "x":
                        avatar.head.mouth.x=info.value;
                        break;
                    case "y":
                        avatar.head.mouth.y=info.value;
                        break;
                } 
            }

            // Set speaking status.
            function setSpeak(){
                avatar.head.mouth.speak=!avatar.head.mouth.speak;
            }

        </script>
    </body>
</html>
