<!DOCTYPE html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Oswell's Avatar</title>
        <link rel="stylesheet" href="style.css">
        <script src="https://kit.fontawesome.com/03072761fd.js" crossorigin="anonymous"></script>
    </head>
    <body>

        <div class="main_box">

            <div id="cameraOutput">
                <canvas id="camCanvas" width="170" height="130"></canvas>
                <canvas id="detectionCanvas" width="170" height="130"></canvas>
            </div>

            <input type="checkbox" id="check">
            <div class="btn_one">
                <label for="check">
                    <i class="fa-solid fa-bars"></i>
                </label>
            </div>
            <div class="sidebar_menu">
                <div class="logo">
                    <a href="#">SETTINGS</a>
                </div>
                <div class="btn_two">
                    <label for="check">
                        <i class="fa-solid fa-xmark"></i>
                    </label>
                </div>
                <div class="menu">
                    <ul>
                        <li><a href="#"><i class="fa fa-tasks" aria-hidden="true"></i>
                            INPUT</a></li>
                        <li><a href="#"><i class="fa-solid fa-gauge"></i>
                            SPEED</a></li>
                        <li><a href="#"><i class="fa-solid fa-weight-hanging"></i>
                            GRAVITY</a></li>
                        <li><a href="#"><i class="fa-solid fa-glasses"></i>
                            DEBUG</a></li>
                        <li><a href="#"><i class="fa-solid fa-circle-info"></i>
                            ABOUT</a></li>
                    </ul>
                </div>
                <div class="social_media">
                    <a href="#"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#"><i class="fa-brands fa-youtube"></i></a>
                    <a href="#"><i class="fa-regular fa-envelope"></i></a>
                </div>
            </div>
            <canvas id="myCanvas"></canvas>

        </div>

        <div id="side-panel">
            <input type="checkbox" id="debugChk" onchange="toggleDebug(this)">DEBUG</input>
            <br><br>
            <div id="sliders">
                Face:<br>
                X <input type="range" min="-0.75" max="0.75" step="0.1" onChange="updateLookAt(this, 'x')"/>
                <br>
                Y <input type="range" min="-0.45" max="0.65" step="0.05" onChange="updateLookAt(this, 'y')"/>
                <br><br>
                Mouth:<br>
                X <input type="range" min="-0.70" max="0.70" step="0.1" onChange="updateMouth(this, 'x')"/>
                <br>
                Y <input type="range" min="0.00" max="0.80" step="0.05" onChange="updateMouth(this, 'y')"/>
                
                <br><br>
            </div>
            <input type="checkbox" id="speakChk" onchange="toggleSpeak(this)">Speak</input>
            
            
            <div id="inputContainer">
                INPUT:
                <br>
                <select name="input" id="input" onchange="onInputChange(this)">
                    <option value="face detection">face detection</option>
                    <option value="markers">markers</option>
                    <option value="sliders">sliders</option>
                </select>
                <br><br>
            </div>
            <button id="calibrateBtn" onclick="calibrate()">Calibrate</button> 
        </div>
        
        <script src="face-api.min.js"></script>
        <script src="avatar.js"></script>
        <script src="head.js"></script>
        <script src="complexions.js"></script>
        <script src="eye.js"></script>
        <script src="ear.js"></script>
        <script src="nose.js"></script>
        <script src="mouth.js"></script>
        <script src="neck.js"></script>
        <script src="body.js"></script>
        <script src="controlPanel.js"></script>
        <script src="camera.js"></script>
        <script src="math.js"></script>
        <script src="doublePendulum.js"></script>
        <script src="pendulum.js"></script>
        <script src="physics.js"></script>
        <script src="reference.js"></script>

        <script>
            let DEBUG=false;

            const skinTone="rgba(219,221,225,0.9)";
            const lookAt={x:0,y:-0.040,initX:0,initY:-0.040,xRange:[0,0.090],yRange:[-0.040,0.1],xOffset:0,yOffset:0};
            const avatar=new Avatar(lookAt,skinTone);

            const canvas=document.getElementById("myCanvas");
            const ctx=canvas.getContext("2d");
            initCanvas(500,500);   
 
            animate();

            function initCanvas(width,height){
                canvas.width=width;
                canvas.height=height; 

                // Transform canvas into coordinate system between [-1, 1].
                ctx.translate(canvas.width/2,canvas.height/2);
                // Original width is 800, reduced to 500, scale by 8/5 to keep original avatar dimensions.
                ctx.scale(canvas.width*0.5*1.6,canvas.height*0.5);
                ctx.lineWidth=0.005;

                if(DEBUG){
                    canvas.addEventListener("click",getCoords);
                }
            }
            
            function animate(){
                ctx.clearRect(-1,-1,2,2);
                
                // TODO: Control based on the type of input (face detection, markers, or sliders).
                // if(video){
                //     if(processType=="face detection") {
                //         processDetections();
                //     } else {
                //         processImage();
                //     }
                // }

                avatar.draw(ctx);
                requestAnimationFrame(animate);
            }
            
        </script>
    </body>
</html>
